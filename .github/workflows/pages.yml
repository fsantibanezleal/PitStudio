# Deploy the web companion to GitHub Pages from main (Pages source = GitHub Actions). Actions pinned to commit SHAs.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 — outputs base_path (/<repo>)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ACCESS_PASSPHRASE: ${{ secrets.ACCESS_PASSPHRASE }} # only its SHA-256 reaches the bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ACCESS_PASSPHRASE: ${{ secrets.ACCESS_PASSPHRASE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: web/build/client }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: web/.nvmrc, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:live # start page, a prerendered deep route, an unknown route (404), the shell
        env: { LIVE_URL: "${{ needs.deploy.outputs.page_url }}" }
