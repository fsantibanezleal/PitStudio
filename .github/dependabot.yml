version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: "/pipeline"
    schedule: { interval: weekly }
    groups: { pipeline: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: "/web"
    schedule: { interval: weekly }
    groups:
      react-3d: { patterns: ["react", "react-dom", "@react-three/*", "three"] }
      web: { patterns: ["*"] }
    ignore:
      - dependency-name: "@types/node"   # must match the Node major in web/.nvmrc
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
