name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps to reproduce, expected vs actual." }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where, description: "Page/URL, CLI command or pipeline stage." }
  - type: input
    id: env
    attributes: { label: Environment, description: "Version or commit, browser/OS, CPU/GPU." }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, render: text }
