[project]
name = "pitstudio"
version = "0.0.0"
description = "Physical-AI simulation studio for open-pit mining: OpenUSD scenes, GPU physics, RTX sensors, synthetic data, trained models and an interactive web explorer"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.14.*"
dependencies = [
    "jsonschema>=4.26.0",
    "minephys",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]  # added with `uv add`; versions are written by the resolver, never by hand

[project.optional-dependencies]
api = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]  # optional local API over the same engine (api/)
runner = [
    "filelock>=4.0.10",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[tool.uv.sources]
minephys = { git = "https://github.com/fsantibanezleal/minephys" }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "PT", "RUF"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
markers = ["req(id): links a test to a requirement ID", "gpu: needs CUDA", "slow: long-running"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
