[project]
name = "pitstudio"
version = "0.0.0"
description = "Physical-AI simulation studio for open-pit mining: OpenUSD scenes, GPU physics, RTX sensors, synthetic data, trained models and an interactive web explorer"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.14.*"
dependencies = [
    "jsonschema>=4.26.0",
    "minephys",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]  # added with `uv add`; versions are written by the resolver, never by hand

[project.optional-dependencies]
api = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]  # optional local API over the same engine (api/)
runner = [
    "filelock>=4.0.10",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "networkx>=3.7",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "schemathesis>=4.30.1",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
oracle = [
    "pyslope>=1.4.0",
]

[project.scripts]
studio = "pitstudio.runner.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src", "api"]

[tool.uv.sources]
minephys = { git = "https://github.com/fsantibanezleal/minephys", rev = "51e9c0cef8aaa396ab69ee800f0d7a8e4ea5582d" }

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["src/pitstudio/contracts/_generated"]  # generated by tools/gen_types.py; only `ruff format` applies

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# locked spec-013 tests put their helper packages on sys.path and import them in one block (I001 cannot be applied to a locked file)
"tests/**/test_t_013_*.py" = ["I001"]

[[tool.mypy.overrides]]
# generated by datamodel-code-generator: dict keys with a pattern come out as `constr(...)` calls, which mypy rejects as a
# type; the models are checked at run time (pydantic) and by tests/contract/test_t_001_041_agreement.py instead
module = "pitstudio.contracts._generated.*"
ignore_errors = true

[tool.pytest]
minversion = "9.0"
# tests that import `pitstudio_pipeline` run in the pipeline environment (FR-000-17; see pipeline/pyproject.toml): the root job
# must not collect them, the package is absent from this environment
addopts = [
    "-ra",
    "--strict-markers",
    "--ignore=tests/pipeline",
    "--ignore=tests/gpu",
    "--ignore=tests/contract/test_t_008_010_registry.py",
    "--ignore=tests/contract/test_t_008_060_data_cards.py",
]
testpaths = ["tests"]
markers = ["req(id): links a test to a requirement ID", "gpu: needs CUDA", "slow: long-running"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
