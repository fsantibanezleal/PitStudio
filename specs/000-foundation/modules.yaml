  from: frag-dataset-builder
  to: unet-train
  contract: training-tiles
  schema: null
  schema_state: none
  what: synthetic 512 x 512 training tiles with masks
  gap_class: undefined
  evidence: FR-012-17 and FR-012-22 name the training tiles; DC-012-04 is the render index that feeds the builder, not its output
  availability:
    absent:
      behaviour: 'no Isaac Sim: TSTR, synthetic x50 and C2ST are "not run" and TRTR and watershed publish as "TRTR only - synthetic
        arm not run"; no Mendeley archive: TRTR, TSTR and the real comparison are "not run" and D1 says "synthetic-only U-Net claim;
        no measured sim-to-real"'
      covered_by:
      - FR-012-39
      - FR-012-40
    fixture:
      behaviour: 'fragmentation stages run on fixtures; reports carry `fixture: true` and D1 says "fixture, no measured result"'
      covered_by:
      - FR-012-47
    partial:
      behaviour: '"TRTR only - synthetic arm not run" is the partial report: the arms that ran are published with that label'
      covered_by:
      - FR-012-39
    real:
      behaviour: the artefact is used as the producing requirement describes; the contract is not yet defined
      covered_by: []
      na: 'gap edge: no DC row and no schema (module-map section 5.3)'
    stale:
      behaviour: an archive that fails its SHA-256 check marks the real arms "not run"; a changed render or fragment digest fails `input-stale`
      covered_by:
      - FR-012-40
      - FR-012-48
    invalid:
      behaviour: an unsafe, mis-sized or missing archive member stops the reader and leaves no partial dataset
      covered_by:
