# Case B1, autonomous and manned traffic and proximity (spec 018 FR-018-55, FR-018-16; docs M20), CPU stage only.
# One stage: for each of 30 seeds one 8 h shift of the pinned minehaulsim engine (adapter of spec 007, traffic mode, engine
# profile) over the road network of the A1 pit design (st20_pit_design of a1-scene) with 20 trucks and sptf dispatch, whose
# truck trajectories are replayed with manned light vehicles in the lane-based traffic layer of pitstudio_pipeline.haulage.traffic:
# constant-velocity time to collision per encounter, near-misses per 1,000 vehicle-hours and throughput against the share of
# autonomous trucks (0, 25, 50, 75, 100 %) and the number of light vehicles (0, 4, 8, 16), on paired seeds. The engine's class
# parameters are class-representative; the reaction times, decelerations, disc radii, lane offset and the light-vehicle patrol
# are illustrative inputs, UNVERIFIED for any site; no proximity or incident data exists, so nothing is validated. The RTX
# lidar and radar frames and the Cosmos reasoning of case B1 are GPU stages for later and are not in this recipe.
id: b1
case: B1
seed: 0
description: B1 mixed autonomous and manned traffic on the Bingham pit design road network, time to collision, near-misses and throughput against the autonomous share.
stages:
  - id: s05_synthesize
    variant: mixed-traffic-sweep
    env: pipeline
    tool: minehaulsim
    entry: pitstudio_pipeline.haulage.b1_run
    inputs: []  # the road network file is named in params; its digest is in the run record
    params:
      seed: 0
      inputs:
        road_network: processed/scene/a1-bingham-v3/st20_pit_design/design/road-network.geojson
      scenario:
        horizon_s: 28800.0       # one 8 h shift
        warmup_s: 3600.0         # the first hour is discarded
        truck_class: CAT_793F    # the engine catalog class (public specification magnitudes, class-representative)
        loader_class: SHOVEL_45
        rolling_resistance_pct: 2.5   # illustrative in-pit value, UNVERIFIED for the site
        speed_limit_kmh: {ramp: 30.0, bench-road: 40.0}   # illustrative, UNVERIFIED
        simplify_epsilon_m: 5.0  # Douglas-Peucker tolerance of the road polylines
        loaders: {n46: 0, n56: 0, n66: 1}   # bench-road ends at -150, -300 and -450 m: declared destination = index into dumps
        dumps: [n0, n1]          # the crusher at the pit exit, a waste dump on the first junction below the rim
      traffic:                   # every value is an illustrative input, UNVERIFIED (see pitstudio_pipeline.haulage.traffic.DEFAULTS)
        dt_s: 0.5
        lane_offset_m: 6.5       # lane centre to road centre line; two lanes of about 3.5 truck widths overall
        radius_m: {haul-truck: 5.0, light-vehicle: 2.0}
        reaction_s: {autonomous: 0.5, manned: 1.5}
        brake_ttc_s: 6.0
        emergency_ttc_s: 3.5
        decel_mps2: {haul-truck: 2.0, light-vehicle: 4.0}
        accel_mps2: {haul-truck: 1.0, light-vehicle: 2.0}
        look_ahead_m: 100.0
        follow_half_angle_deg: 20.0
        encounter_radius_m: 60.0
        near_miss_ttc_s: 3.0     # FR-018-55
        brake_hold_s: 1.0
        release_s: 30.0
        light_vehicle: {speed_factor: 0.9, dwell_mean_s: 60.0}
      sweep:
        fleet_size: 20
        dispatcher: sptf
        autonomous_shares: [0.0, 0.25, 0.5, 0.75, 1.0]
        light_vehicles: [0, 4, 8, 16]
        seeds: 30
        reference: {share: 0.5, light_vehicles: 8}
    resources: {gpu: none, disk_gib_est: 0.1, cpu: 8}
    determinism: bitwise
    timeout_s: 21600
    outputs:
      - {path: results-summary.json, schema: json, publish: true}
      - {path: charts/b1-near-miss-rate-vs-share.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-near-miss-rate-vs-density.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-min-ttc-percentiles-vs-share.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-min-ttc-distribution.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-conflicts-per-shift.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-throughput-vs-share.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-scenario-table.json, schema: contract-chart-series, publish: true}
      - {path: charts/b1-inputs-table.json, schema: contract-chart-series, publish: true}
