# Studio tool registry (spec 001-contracts, schema contracts/tools.schema.json).
# 20 studio tools (17 with status not-yet-run or done, 3 evaluated-not-adopted) plus the components that may appear
# as `producer.tool`. Versions are references: lock entries are resolved by tools/check_contracts.py; a git tag is
# the tag of the pinned release for web and external tools that are not in a lock yet. Nothing here has run yet.
tools:
- id: openusd
  name: OpenUSD
  category: studio-tool
  envs:
  - studio
  version:
    from_lock: studio/uv.lock
    package: usd-core
  spdx:
  - LicenseRef-TOST-1.0
  osi: true
  licence_class: attribution
  ring: Adopt
  lane: replay
  performance: public
  role: 'Pit scenes from real lidar: terrain, design, fleet, sensor and weather layers; the same scene spec emits
    the glTF and 3D Tiles of the web scene tabs.'
  cases:
  - B1
  - B2
  - C2
  - C3
  - D1
  - E1
  - E2
  produces:
  - usd
  - tiles
  status: not-yet-run
  docs_page: docs/frameworks/openusd.md
- id: warp
  name: NVIDIA Warp
  category: studio-tool
  envs:
  - studio
  - isaac
  - rtx
  version:
    from_lock: studio/uv.lock
    package: warp-lang
  spdx:
  - Apache-2.0
  osi: true
  licence_class: attribution
  ring: Adopt
  lane: replay
  performance: public
  role: Own DEM, shallow-water and dust kernels; differentiable friction calibration.
  cases:
  - A3
  - C2
  - C3
  - D1
  produces:
  - field
  - shard
  - table
  status: not-yet-run
  docs_page: docs/frameworks/warp.md
  alternatives_rejected:
  - name: PhysX particles
    reason: 'Position-based dynamics: animation-grade, no calibrated constitutive model; schema not finalized.'
  - name: Genesis
    reason: Published speed claims were about 150x lower in an independent re-run; Python below 3.14.
  - name: DEM-Engine (DEME)
    reason: Linux-only wheels, so Windows needs WSL2.
  - name: Taichi
    reason: No release since 2025-07-31.
  - name: warp.sim
    reason: Removed in Warp 1.10 in favour of Newton.
