[project]
name = "pitstudio-pipeline"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
    "pitstudio",
    "onnx",
    "onnxslim",
    "polars",
    "pyarrow",
    "duckdb",
    "zarr",
    "pooch",
    "pandera",
    "scikit-learn",
    "httpx",
    "minehaulsim",
    "oreblocks",
    "segmentation-models-pytorch==0.5.0",
    "timm>=1.0.30",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "py7zr>=1.1.3",
    "psutil>=7.2.2",
    "tifffile>=2026.9.20",
    "pillow>=12.3.0",
    "shapely>=2.2.0",
]   # direct deps only; versions are resolved and locked by uv (never hand-pinned)

[project.optional-dependencies]
cpu = ["torch", "torchvision", "onnxruntime"]
cu126 = ["torch", "torchvision", "onnxruntime"]          # driver >= 525
cu130 = ["torch", "torchvision", "onnxruntime-gpu"]      # driver >= 580 (this laptop: 582.78)

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
# segmentation-models-pytorch 0.5.0 imports huggingface_hub APIs that 2.x removed; the unconstrained resolve picks 2.2.0
# (which also fails with "No module named httpx2"), so the resolver is held below 1.0 (T-012-000).
constraint-dependencies = ["huggingface-hub<1.0"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
pitstudio = { path = "..", editable = true }
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }, { index = "pytorch-cu130", extra = "cu130" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }, { index = "pytorch-cu130", extra = "cu130" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest]
pythonpath = ["src"]   # pitstudio_pipeline lives in pipeline/src (package = false)
# the tests of this lane live in the repository-level tests/ folder (FR-000-17: they run where the code runs); the root job
# ignores exactly these paths (see [tool.pytest] of the root pyproject.toml)
testpaths = [
    "tests",
    "../tests/pipeline",
    "../tests/gpu",
    "../tests/contract/test_t_008_010_registry.py",
    "../tests/contract/test_t_008_060_data_cards.py",
]
addopts = ["-ra", "--strict-markers"]
markers = ["req(id): links a test to a requirement ID", "gpu: needs CUDA", "slow: long-running"]
