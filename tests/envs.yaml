# Which Python environment owns a test file (FR-000-17: tests pass in the environment that owns the code).
# The root environment (`uv sync` at the repository root) owns every file not matched here. A file owned by another environment is not
# collected by a run in this one: it is ignored, never skipped (tests/conftest.py). The running environment is named by the variable
# PITSTUDIO_TEST_ENV (root, pipeline, studio); the default is root. First matching owner wins; globs are relative to the repository root.
studio:     # Warp, Newton, cma, OpenUSD (studio/pyproject.toml)
  - tests/unit/test_t_005_*.py
  - tests/metamorphic/test_t_005_*.py
  - tests/unit/test_t_011_03[3-9]_*.py
  - tests/unit/test_t_011_060_*.py
  - tests/unit/test_t_011_014_planar_*.py   # the planar reference-data generator (Warp DEM, spec 011 FR-011-03)
  - tests/unit/test_t_011_heap_simulator_smoke.py
  - tests/contract/test_t_011_036_*.py
  - tests/unit/test_t_009_011_*.py
  - tests/unit/test_t_009_016_*.py      # the SDG table, inputs and shard driver import pitstudio_studio, minephys and scipy
  - tests/unit/test_t_009_100_*.py      # camera and object line of sight on the carved surface (the SDG table, studio environment)
  - tests/unit/test_t_004_099_*.py      # the carved design surface of st20_pit_design (OpenUSD, zarr, shapely, studio environment)
  - tests/unit/test_t_004_100_*.py      # procedural machine and person assets of st30_assets (OpenUSD, studio environment)
  - tests/unit/test_t_004_101_*.py      # windrow ridges of st20_pit_design (shapely, scipy, OpenUSD, studio environment)
  - tests/unit/test_t_009_101_*.py      # camera clearance and object visibility with size and occlusion (the SDG table, studio environment)
  - tests/property/test_t_009_013_*.py
  - tests/pipeline/test_t_004_053_*.py
  - tests/property/test_t_006_030_*.py   # the real nvtx package (spec 006, FR-006-17)
  - tests/unit/test_t_006_033_*.py       # a Warp CPU workload with the real nvtx package (NFR-006-02)
  # imports proven by the root run of 2026-11-22 (ModuleNotFoundError in the root environment, green in this one)
  - tests/metamorphic/test_t_004_011_*.py   # pyproj, pitstudio_studio.scene
  - tests/metamorphic/test_t_004_020_*.py   # shapely, pitstudio_studio.scene.design
