  - tests/property/test_t_004_031_*.py      # pxr
  - tests/property/test_t_004_052_*.py      # pxr
  - tests/unit/test_sdg_inputs_tool.py      # shapely, the SDG input builder of the studio lane
  - tests/unit/test_t_004_0[0-4]*_*.py      # pxr, pyproj, shapely, laspy through pitstudio_studio.scene (spec 004 scene pipeline)
  - tests/unit/test_web_terrain_extract.py  # pxr, scipy: the OpenUSD side of the web bake (spec 016, FR-016-19)
  - tests/unit/test_t_004_05*_*.py
  - tests/unit/test_t_004_09[24-8]_*.py
  - tests/unit/test_t_013_01[345]_*.py      # pyarrow and pitstudio_rtx (studio/rtx): the sensor lane
  - tests/unit/test_t_013_024_*.py
  - tests/unit/test_t_013_060_*.py
  - tests/unit/test_t_013_092_*.py
  - tests/contract/test_t_013_017_*.py
  - tests/pipeline/test_t_017_023_*.py   # OR-Tools SimpleMaxFlow oracle of the min-cut (studio environment, plan 017)
  - tests/pipeline/test_t_017_042_*.py   # rasterio GeoTIFFs of the DEM grid preparation (studio environment)
