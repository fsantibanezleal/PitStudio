<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Fourier neural operator architecture</title>
  <desc id="d">Input fields are lifted to a wider channel space, passed through Fourier layers whose spectral branch is written as discrete-Fourier-transform matrix multiplications, and projected back to output fields.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--primary)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .arrowhead-accent{fill:var(--accent)}
    .hdr{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
    .empty{fill:none;stroke:var(--border);stroke-width:1;stroke-dasharray:4 4}
    .lane-live{fill:var(--chart-2)}
    .lane-pre{fill:var(--chart-4)}
    .lane-local{fill:var(--warning)}
    .learned{fill:var(--chart-5)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="510"/>
  <text x="24" y="32" class="title">FNO surrogate — Fourier layers as matrix multiplications</text>
  <text x="24" y="52" class="path">pipeline/ s30_train → s60_export → web/ ORT-web</text>
  <rect x="20" y="80" width="170" height="150" rx="6" class="box"/>
  <text x="32" y="102" class="title">Input a(x)</text>
  <text x="32" y="121" class="path">Warp runs (st50)</text>
  <text x="32" y="139" class="item">bed elevation z_b</text>
  <text x="32" y="157" class="item">initial depth h₀</text>
  <text x="32" y="175" class="item">rheology channels</text>
  <rect x="226" y="80" width="120" height="150" rx="6" class="box"/>
  <text x="238" y="102" class="title">Lift P</text>
  <text x="238" y="121" class="path">1×1 linear</text>
  <text x="238" y="139" class="item">channels →</text>
  <text x="238" y="157" class="item">width d_v</text>
  <path d="M190,155 H226" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="148" class="label" text-anchor="middle">a</text>
  <rect x="382" y="70" width="560" height="230" rx="8" class="band"/>
  <text x="398" y="94" class="title">Fourier layer × L</text>
  <text x="398" y="113" class="path">MatMul only</text>
  <rect x="398" y="126" width="160" height="76" rx="6" class="box"/>
  <text x="410" y="148" class="title">Forward DFT</text>
  <text x="410" y="166" class="item">C·a, −S·a (K modes)</text>
  <rect x="578" y="126" width="150" height="76" rx="6" class="box"/>
  <text x="590" y="148" class="title">Mode weights</text>
  <text x="590" y="166" class="item">Rʳ, Rⁱ per mode</text>
  <rect x="748" y="126" width="176" height="76" rx="6" class="box"/>
  <text x="760" y="148" class="title">Inverse DFT</text>
  <text x="760" y="166" class="item">real output</text>
  <rect x="398" y="222" width="160" height="66" rx="6" class="box"/>
  <text x="410" y="244" class="title">Pointwise W</text>
  <text x="410" y="262" class="item">1×1 linear</text>
  <rect x="748" y="222" width="176" height="66" rx="6" class="box-accent"/>
  <text x="760" y="244" class="title">Add, then σ</text>
  <text x="760" y="262" class="item">gives v_(l+1)</text>
  <path d="M346,164 H398" class="edge" marker-end="url(#arrow)"/>
  <text x="372" y="157" class="label" text-anchor="middle">v_l</text>
  <path d="M366,164 V255 H398" class="edge" marker-end="url(#arrow)"/>
  <path d="M558,164 H578" class="edge" marker-end="url(#arrow)"/>
  <text x="568" y="120" class="label" text-anchor="middle">â</text>
  <path d="M728,164 H748" class="edge" marker-end="url(#arrow)"/>
  <text x="738" y="120" class="label" text-anchor="middle">b̂</text>
  <path d="M836,202 V222" class="edge" marker-end="url(#arrow)"/>
  <text x="844" y="216" class="label">spectral</text>
  <path d="M558,255 H748" class="edge" marker-end="url(#arrow)"/>
  <text x="653" y="248" class="label" text-anchor="middle">local</text>
  <rect x="978" y="80" width="200" height="96" rx="6" class="box"/>
  <text x="990" y="102" class="title">Project Q</text>
  <text x="990" y="121" class="path">1×1 linear</text>
  <text x="990" y="139" class="item">width → outputs</text>
  <rect x="978" y="200" width="200" height="110" rx="6" class="box"/>
  <text x="990" y="222" class="title">Output u(x)</text>
  <text x="990" y="241" class="path">fields at t + Δt</text>
  <text x="990" y="259" class="item">depth, velocity</text>
  <text x="990" y="277" class="item">autoregressive rollout</text>
  <path d="M924,255 H952 V128 H978" class="edge" marker-end="url(#arrow)"/>
  <text x="960" y="112" class="label" text-anchor="middle">v_L</text>
  <path d="M1078,176 V200" class="edge" marker-end="url(#arrow)"/>
  <text x="1086" y="193" class="label">u</text>
  <rect x="20" y="340" width="360" height="150" rx="6" class="box"/>
  <text x="32" y="362" class="title">Training</text>
  <text x="32" y="381" class="path">pipeline/ s30_train</text>
  <text x="32" y="399" class="item">loss: relative L² error</text>
  <text x="32" y="417" class="item">held-out terrains (3DEP crops)</text>
  <text x="32" y="435" class="item">budget 0.5–2 GPU-h (estimate)</text>
  <rect x="410" y="340" width="360" height="150" rx="6" class="box-accent"/>
  <text x="422" y="362" class="title">Why MatMul</text>
  <text x="422" y="381" class="path">s60_export · opset 17–19</text>
  <text x="422" y="399" class="item">rfft export breaks shape inference</text>
  <text x="422" y="417" class="item">complex tensors avoided</text>
  <text x="422" y="435" class="item">exact for the K kept modes</text>
  <rect x="800" y="340" width="380" height="150" rx="6" class="box"/>
  <text x="812" y="362" class="title">Live lane</text>
  <text x="812" y="381" class="path">ORT-web WebGPU → WASM</text>
  <text x="812" y="399" class="item">about 5 MB model</text>
  <text x="812" y="417" class="item">≤ 50 ms per step target</text>
  <text x="812" y="435" class="item">acceptance: rel. L² ≤ 5 %</text>
  <text x="812" y="453" class="caveat">fallback: baked fields</text>
  <rect x="802" y="342" width="5" height="146" class="lane-live"/>
  <path d="M200,340 V318 H600 V300" class="edge" marker-end="url(#arrow)"/>
  <text x="212" y="334" class="label">weights</text>
  <path d="M700,300 V340" class="edge" marker-end="url(#arrow)"/>
  <text x="708" y="326" class="label">graph</text>
  <path d="M1078,310 V340" class="edge" marker-end="url(#arrow)"/>
  <text x="1086" y="330" class="label">model.onnx</text>
</svg>
