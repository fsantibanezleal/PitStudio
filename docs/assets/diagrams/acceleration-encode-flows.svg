<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Acceleration and encode flows</title>
  <desc id="d">Top: PyTorch weights exported to ONNX run on ONNX Runtime CPU, CUDA and TensorRT execution providers and on native TensorRT 11.3 engines, and every engine passes a parity gate before its numbers reach the published Acceleration table. Bottom: rendered frames are encoded with FFmpeg 8.1 NVENC into AV1 and H.264, a VMAF search picks the bitrate, and the web pair stays within 25 MB.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .ah-accent{fill:var(--accent)}
    .ah-bad{fill:var(--danger)}
    .edge-bad{stroke:var(--danger);stroke-width:1.8;fill:none}
    .head{font:600 13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .box-replay{fill:var(--surface-2);stroke:var(--chart-4);stroke-width:2}
    .box-bad{fill:var(--surface-2);stroke:var(--danger);stroke-width:2}
    .box-warn{fill:var(--surface-2);stroke:var(--warning);stroke-width:2;stroke-dasharray:6 4}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah-accent"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah-bad"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="20" y="30">Acceleration (our models on one GPU) and video encode (NVENC)</text>

  <!-- band 1: acceleration -->
  <rect class="band" x="15" y="44" width="1170" height="396" rx="8"/>
  <text class="head" x="30" y="66">ACCELERATION · same ONNX files as the web · one GPU job at a time (lock gpu0.compute)</text>

  <rect class="box" x="30" y="84" width="220" height="160" rx="6"/>
  <text class="title" x="42" y="108">Train</text>
  <text class="path" x="42" y="128">s30_train · PyTorch</text>
  <text class="item" x="42" y="150">fp32 checkpoint (ignored)</text>
  <text class="item" x="42" y="168">golden set ≥ 200 vectors</text>
  <text class="item" x="42" y="186">reference outputs in fp32</text>

  <rect class="box" x="280" y="84" width="220" height="160" rx="6"/>
  <text class="title" x="292" y="108">Export</text>
  <text class="path" x="292" y="128">s60_export</text>
  <text class="item" x="292" y="150">torch.onnx.export (dynamo)</text>
  <text class="item" x="292" y="168">verify=True, opset 17–19</text>
  <text class="item" x="292" y="186">IR version pinned to 10</text>
  <text class="caveat" x="292" y="228">onnx writes IR 14 by default</text>

  <rect class="box" x="530" y="84" width="300" height="160" rx="6"/>
  <text class="title" x="542" y="108">ONNX Runtime backends</text>
  <text class="path" x="542" y="128">pipeline/ · onnxruntime-gpu 1.30</text>
  <text class="item" x="542" y="150">CPU EP: parity reference</text>
  <text class="item" x="542" y="168">CUDA EP: CUDA 13 build</text>
  <text class="item" x="542" y="186">TensorRT EP: TensorRT 10.14 libraries</text>
  <text class="caveat" x="542" y="228">fp16 via the EP flag on an fp32 graph</text>

  <rect class="box" x="530" y="264" width="300" height="160" rx="6"/>
  <text class="title" x="542" y="288">Native TensorRT engines</text>
  <text class="path" x="542" y="308">pipeline/accel/ · s62_accel</text>
  <text class="item" x="542" y="330">TensorRT 11.3: fp32, TF32 cleared</text>
  <text class="item" x="542" y="348">fp16: cast graph, LayerNorm kept fp32</text>
  <text class="item" x="542" y="366">int8 / fp8: Q/DQ (fp8 at opset 19)</text>
  <text class="caveat" x="542" y="408">engines: device- and version-specific</text>

  <rect class="box-warn" x="30" y="264" width="470" height="160" rx="6"/>
  <text class="title" x="42" y="288">TensorRT for RTX (optional)</text>
  <text class="path" x="42" y="308">internal only · numbers never published</text>
  <text class="item" x="42" y="330">its licence (§2.13) forbids disclosing benchmark or</text>
  <text class="item" x="42" y="348">performance data without NVIDIA's written permission</text>
  <text class="item" x="42" y="366">regular TensorRT licence: no such clause;</text>
  <text class="item" x="42" y="384">the reviewed text is pinned by SHA-256 in the probe</text>
  <text class="caveat" x="42" y="410">text changes → results drop to local-only</text>

  <rect class="box-accent" x="860" y="84" width="310" height="170" rx="6"/>
  <text class="title" x="872" y="108">Per-engine parity gate</text>
  <text class="path" x="872" y="128">s64_bench</text>
  <text class="item" x="872" y="150">every engine, every TRT version and EP</text>
  <text class="item" x="872" y="168">fp32: rtol 1e-3, atol 1e-5 vs PyTorch</text>
  <text class="item" x="872" y="186">fp16 / int8 / fp8: task metric Δ ≤ 1 pp</text>
  <text class="item" x="872" y="204">masks IoU ≥ 0.99; corruption curves</text>
  <text class="caveat" x="872" y="236">no TensorRT path assumed safe (#4813)</text>

  <rect class="box-replay" x="860" y="270" width="310" height="80" rx="6"/>
  <text class="title" x="872" y="294">Published: Acceleration tab</text>
  <text class="path" x="872" y="314">/results · table &lt; 200 KB</text>
  <text class="item" x="872" y="334">p50 / p99, throughput, J/inference, Δ</text>

  <rect class="box-bad" x="860" y="362" width="310" height="62" rx="6"/>
  <text class="title" x="872" y="386">Rejected variants</text>
  <text class="item" x="872" y="408">listed with their reason, never dropped</text>

  <path class="edge" d="M250,164 H276" marker-end="url(#arrow)"/>
  <text class="label" x="252" y="156">fp32</text>
  <path class="edge-accent" d="M500,164 H526" marker-end="url(#arrowA)"/>
  <path class="edge-accent" d="M514,164 V344 H526" marker-end="url(#arrowA)"/>
  <text class="label" x="503" y="256">.onnx</text>
  <path class="edge" d="M830,164 H856" marker-end="url(#arrow)"/>
  <path class="edge" d="M830,344 H844 V200 H856" marker-end="url(#arrow)"/>
  <text class="label" x="832" y="156">outputs</text>
  <path class="edge-accent" d="M1015,254 V266" marker-end="url(#arrowA)"/>
  <text class="label" x="1022" y="264">pass</text>
  <path class="edge-bad" d="M1160,254 V262 H1176 V393 H1172" marker-end="url(#arrowX)"/>
  <text class="label" x="1120" y="264">fail</text>

  <!-- band 2: encode -->
  <rect class="band" x="15" y="456" width="1170" height="330" rx="8"/>
  <text class="head" x="30" y="478">ENCODE · studio/ (Python 3.14) runs FFmpeg as an external tool · lock gpu0.nvenc</text>

  <rect class="box" x="30" y="496" width="230" height="180" rx="6"/>
  <text class="title" x="42" y="520">Frames</text>
  <text class="path" x="42" y="540">st52 · st58 · replays</text>
  <text class="item" x="42" y="562">lossless PNG or EXR</text>
  <text class="item" x="42" y="580">30 fps sequences</text>
  <text class="item" x="42" y="598">frame-list SHA-256</text>
  <text class="caveat" x="42" y="660">Kit MP4 capture: preview only</text>

  <rect class="box" x="290" y="496" width="280" height="180" rx="6"/>
  <text class="title" x="302" y="520">NVENC encode</text>
  <text class="path" x="302" y="540">FFmpeg 8.1 LGPL (external)</text>
  <text class="item" x="302" y="562">av1_nvenc → 1080p, primary</text>
  <text class="item" x="302" y="580">h264_nvenc → 720p, fallback</text>
  <text class="item" x="302" y="598">8-bit 4:2:0, MP4 +faststart</text>
  <text class="item" x="302" y="616">SDK 13.0 headers: driver ≥ 570</text>
  <text class="caveat" x="302" y="660">FFmpeg 9.x needs driver ≥ 610</text>

  <rect class="box-accent" x="600" y="496" width="260" height="180" rx="6"/>
  <text class="title" x="612" y="520">VMAF search</text>
  <text class="path" x="612" y="540">st56_encode · libvmaf</text>
  <text class="item" x="612" y="562">bisect bitrate or cq per clip</text>
  <text class="item" x="612" y="580">score vs the lossless frames</text>
  <text class="item" x="612" y="598">lowest bitrate meeting target</text>
  <text class="caveat" x="612" y="642">targets fixed at specification</text>
  <text class="caveat" x="612" y="660">never a silent quality drop</text>

  <rect class="box-replay" x="890" y="496" width="280" height="180" rx="6"/>
  <text class="title" x="902" y="520">Web pair</text>
  <text class="path" x="902" y="540">≤ 25 MB per pair</text>
  <text class="item" x="902" y="562">AV1 1080p + H.264 720p</text>
  <text class="item" x="902" y="580">WebP poster, preload="none"</text>
  <text class="item" x="902" y="598">MediaCapabilities picks a source</text>
  <text class="caveat" x="902" y="660">video budget ≤ 150 MB (6 pairs)</text>

  <path class="edge" d="M260,586 H286" marker-end="url(#arrow)"/>
  <text class="label" x="262" y="578">PNG</text>
  <path class="edge" d="M570,586 H596" marker-end="url(#arrow)"/>
  <text class="label" x="572" y="578">MP4</text>
  <path class="edge-accent" d="M860,586 H886" marker-end="url(#arrowA)"/>
  <text class="label" x="862" y="578">pick</text>

  <rect class="box" x="30" y="696" width="1140" height="78" rx="6"/>
  <text class="title" x="42" y="720">Manifest encoder record (per file)</text>
  <text class="path" x="42" y="742">codec · profile · pix_fmt · size · fps · bytes · sha256 · vmaf{mean, p5} · ffmpeg_version · build_sha256 · args</text>
  <text class="item" x="42" y="762">every published video is reproducible from its frames, its encoder build and its arguments</text>
  <path class="edge" d="M1030,676 V692" marker-end="url(#arrow)"/>
  <text class="label" x="1038" y="690">sha256 + VMAF</text>
</svg>
