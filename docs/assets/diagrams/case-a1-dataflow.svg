<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Case A1 dataflow: from Bingham roads to the dispatch workbench</title>
  <desc id="d">Real Bingham road geometry, calibrated cycle samplers and a seeded scenario grid feed the haulage DES, the match-factor and MVA check, the two-stage LP and the PPO and attention policies; evaluation turns their traces into t/h, queue, match factor and cost per tonne with paired confidence intervals, and the web workbench at /cases/A1 runs the DES and policies live and replays the rest.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .hdr{font:600 18px Inter,system-ui,sans-serif;fill:var(--fg)}
    .arrowhead-accent{fill:var(--accent)}
    .tag-live{fill:none;stroke:var(--chart-2);stroke-width:1.5}
    .tag-replay{fill:none;stroke:var(--chart-4);stroke-width:1.5}
    .tag-local{fill:none;stroke:var(--warning);stroke-width:1.5}
    .tagtxt-live{font:600 13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .tagtxt-replay{font:600 13px Inter,system-ui,sans-serif;fill:var(--chart-4)}
    .tagtxt-local{font:600 13px Inter,system-ui,sans-serif;fill:var(--warning)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="710"/>

  <text class="hdr" x="20" y="34">Case A1 — truck–shovel dispatch: from Bingham roads to the web workbench</text>
  <text class="item" x="20" y="56">Real road geometry + calibrated synthetic cycles → DES / LP / PPO / attention → KPIs with paired 95 % CIs → /cases/A1</text>

  <!-- column bands -->
  <rect class="band" x="10" y="72" width="235" height="598" rx="6"/>
  <text class="title" x="22" y="96">Inputs</text>
  <rect class="band" x="325" y="72" width="235" height="598" rx="6"/>
  <text class="title" x="337" y="96">Engines (studio + pipeline)</text>
  <rect class="band" x="640" y="72" width="235" height="598" rx="6"/>
  <text class="title" x="652" y="96">Evaluation and bake</text>
  <rect class="band" x="955" y="72" width="235" height="598" rx="6"/>
  <text class="title" x="967" y="96">Web /cases/A1</text>

  <!-- inputs -->
  <rect class="box" x="20" y="110" width="215" height="125" rx="4"/>
  <text class="title" x="32" y="134">USGS 3DEP Bingham</text>
  <text class="path" x="32" y="154">st10_terrain</text>
  <text class="item" x="32" y="176">1 m DEM, public domain</text>
  <text class="item" x="32" y="196">→ haul-road graph</text>
  <text class="item" x="32" y="216">ramps · dumps · crusher</text>

  <rect class="box" x="20" y="255" width="215" height="125" rx="4"/>
  <text class="title" x="32" y="279">Cycle samplers</text>
  <text class="path" x="32" y="299">minephys.haulage</text>
  <text class="item" x="32" y="321">generic truck (academic)</text>
  <text class="item" x="32" y="341">load · spot · dump times</text>
  <text class="caveat" x="32" y="363">calibrated synthetic</text>

  <rect class="box" x="20" y="400" width="215" height="110" rx="4"/>
  <text class="title" x="32" y="424">Scenario grid</text>
  <text class="path" x="32" y="444">studio/recipes/</text>
  <text class="path" x="32" y="460">  cases/a1.yaml</text>
  <text class="item" x="32" y="481">fleet sizes × dispatchers</text>
  <text class="item" x="32" y="500">≥ 30 paired seeds</text>

  <rect class="box" x="20" y="530" width="215" height="125" rx="4"/>
  <text class="title" x="32" y="554">No real fleet logs</text>
  <text class="path" x="32" y="574">data/sources.yaml</text>
  <text class="item" x="32" y="596">no open FMS dataset</text>
  <text class="item" x="32" y="616">→ no C2ST / TSTR claim</text>
  <text class="caveat" x="32" y="638">simulation-grade twin</text>

  <!-- engines -->
  <rect class="box" x="335" y="110" width="215" height="100" rx="4"/>
  <text class="title" x="347" y="134">M2 Haulage DES</text>
  <text class="path" x="347" y="154">minehaulsim · TS twin</text>
  <text class="item" x="347" y="176">fixed · nearest · SPTF · SQ</text>
  <text class="item" x="347" y="196">exact-trace parity</text>

  <rect class="box" x="335" y="222" width="215" height="90" rx="4"/>
  <text class="title" x="347" y="246">M1 Match factor + MVA</text>
  <text class="path" x="347" y="266">minephys.haulage</text>
  <text class="item" x="347" y="288">closed-form cross-check</text>

  <rect class="box" x="335" y="324" width="215" height="90" rx="4"/>
  <text class="title" x="347" y="348">M3 Two-stage LP</text>
  <text class="path" x="347" y="368">highspy (HiGHS)</text>
  <text class="item" x="347" y="390">flow rate per path</text>

  <rect class="box-accent" x="335" y="426" width="215" height="110" rx="4"/>
  <text class="title" x="347" y="450">M4 PPO · M5 attention</text>
  <text class="path" x="347" y="470">pipeline/ s30_train</text>
  <text class="item" x="347" y="492">GPU-vectorised env</text>
  <text class="item" x="347" y="512">policy ONNX &lt; 2 MB</text>

  <rect class="box" x="335" y="548" width="215" height="110" rx="4"/>
  <text class="title" x="347" y="572">TensorRT</text>
  <rect class="tag-local" x="455" y="557" width="88" height="22" rx="4"/>
  <text class="tagtxt-local" x="499" y="573" text-anchor="middle">local-only</text>
  <text class="path" x="347" y="592">pipeline/accel s64_bench</text>
  <text class="item" x="347" y="614">per-engine parity</text>
  <text class="caveat" x="347" y="636">engines never published</text>

  <!-- evaluation -->
  <rect class="box-accent" x="650" y="110" width="215" height="250" rx="4"/>
  <text class="title" x="662" y="134">KPIs per dispatcher</text>
  <text class="path" x="662" y="154">s50_evaluate</text>
  <text class="item" x="662" y="176">t/h per shovel and fleet</text>
  <text class="item" x="662" y="196">queue time, min (mean, P90)</text>
  <text class="item" x="662" y="216">match factor MF (–)</text>
  <text class="item" x="662" y="236">cost per tonne, USD/t</text>
  <text class="item" x="662" y="256">paired 95 % CI vs SPTF, LP</text>
  <text class="caveat" x="662" y="282">CI includes 0 →</text>
  <text class="caveat" x="662" y="300">"no significant difference"</text>

  <rect class="box" x="650" y="380" width="215" height="120" rx="4"/>
  <text class="title" x="662" y="404">Export</text>
  <text class="path" x="662" y="424">s60_export</text>
  <text class="item" x="662" y="446">ONNX + parity report</text>
  <text class="item" x="662" y="466">IR version pinned</text>
  <text class="item" x="662" y="486">baked traces, KPI tables</text>

  <rect class="box" x="650" y="520" width="215" height="110" rx="4"/>
  <text class="title" x="662" y="544">Publish</text>
  <text class="path" x="662" y="564">studio publish &lt;run&gt;</text>
  <text class="item" x="662" y="586">run card + manifest</text>
  <text class="item" x="662" y="606">SHA-256 per asset</text>

  <!-- web -->
  <rect class="box-accent" x="965" y="110" width="215" height="280" rx="4"/>
  <text class="title" x="977" y="134">A1 workbench</text>
  <rect class="tag-live" x="1108" y="118" width="62" height="22" rx="4"/>
  <text class="tagtxt-live" x="1139" y="134" text-anchor="middle">LIVE</text>
  <text class="path" x="977" y="154">web/src/routes/cases.tsx</text>
  <text class="item" x="977" y="176">Scene: roads, trucks</text>
  <text class="item" x="977" y="196">Simulate: TS DES worker</text>
  <text class="item" x="977" y="216">  + ORT-web policies</text>
  <text class="item" x="977" y="236">target: 1 shift &lt; 1 s</text>
  <text class="item" x="977" y="256">MF / MVA calculator</text>
  <text class="item" x="977" y="276">Charts: KPIs with CIs</text>
  <text class="item" x="977" y="296">Context: impact, limits</text>

  <rect class="box" x="965" y="410" width="215" height="120" rx="4"/>
  <text class="title" x="977" y="434">Studio replay</text>
  <rect class="tag-replay" x="1092" y="418" width="78" height="22" rx="4"/>
  <text class="tagtxt-replay" x="1131" y="434" text-anchor="middle">REPLAY</text>
  <text class="path" x="977" y="454">producer.tool</text>
  <text class="item" x="977" y="476">training curves</text>
  <text class="item" x="977" y="496">TensorRT latency table</text>

  <rect class="box" x="965" y="550" width="215" height="100" rx="4"/>
  <text class="title" x="977" y="574">T0 fallback</text>
  <rect class="tag-replay" x="1092" y="558" width="78" height="22" rx="4"/>
  <text class="tagtxt-replay" x="1131" y="574" text-anchor="middle">REPLAY</text>
  <text class="path" x="977" y="594">baked traces</text>
  <text class="item" x="977" y="616">no WebGPU / WASM needed</text>

  <!-- edges: inputs → engines -->
  <line class="edge-accent" x1="235" y1="165" x2="333" y2="165" marker-end="url(#arrow-accent)"/>
  <text class="label" x="284" y="157" text-anchor="middle">road graph</text>
  <line class="edge" x1="235" y1="300" x2="333" y2="200" marker-end="url(#arrow)"/>
  <text class="label" x="262" y="236" text-anchor="middle">samplers</text>
  <line class="edge" x1="235" y1="470" x2="333" y2="470" marker-end="url(#arrow)"/>
  <text class="label" x="284" y="462" text-anchor="middle">seeds × grid</text>

  <!-- engines → evaluation -->
  <line class="edge-accent" x1="550" y1="160" x2="648" y2="160" marker-end="url(#arrow-accent)"/>
  <text class="label" x="599" y="152" text-anchor="middle">event traces</text>
  <line class="edge" x1="550" y1="267" x2="648" y2="267" marker-end="url(#arrow)"/>
  <text class="label" x="599" y="259" text-anchor="middle">closed forms</text>
  <line class="edge" x1="550" y1="345" x2="648" y2="345" marker-end="url(#arrow)"/>
  <text class="label" x="599" y="337" text-anchor="middle">LP plans</text>
  <line class="edge" x1="550" y1="470" x2="648" y2="470" marker-end="url(#arrow)"/>
  <text class="label" x="599" y="462" text-anchor="middle">ONNX, rollouts</text>
  <line class="edge" x1="550" y1="590" x2="648" y2="590" marker-end="url(#arrow)"/>
  <text class="label" x="599" y="582" text-anchor="middle">bench tables</text>

  <!-- evaluation → web -->
  <line class="edge-accent" x1="865" y1="200" x2="963" y2="200" marker-end="url(#arrow-accent)"/>
  <text class="label" x="914" y="192" text-anchor="middle">KPIs + CIs</text>
  <line class="edge" x1="865" y1="385" x2="963" y2="385" marker-end="url(#arrow)"/>
  <text class="label" x="914" y="377" text-anchor="middle">ONNX &lt; 2 MB</text>
  <line class="edge" x1="865" y1="470" x2="963" y2="470" marker-end="url(#arrow)"/>
  <text class="label" x="914" y="462" text-anchor="middle">curves, tables</text>
  <line class="edge" x1="865" y1="590" x2="963" y2="590" marker-end="url(#arrow)"/>
  <text class="label" x="914" y="582" text-anchor="middle">baked traces</text>

  <text class="item" x="20" y="696">Highlighted arrows: the KPI path. Tags: LIVE and REPLAY are web lanes; local-only artefacts never leave the studio. Status: not yet run.</text>
</svg>
