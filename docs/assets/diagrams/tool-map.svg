  <rect class="label-bg" x="153" y="568" width="64" height="19" rx="3"/>
  <text x="185" y="582" class="label" text-anchor="middle">USD stage</text>
  <path class="edge" d="M308,595 L394,595" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="306" y="568" width="89" height="19" rx="3"/>
  <text x="351" y="582" class="label" text-anchor="middle">poses, fields</text>
  <path class="edge" d="M474,595 L560,595" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="466" y="551" width="102" height="36" rx="3"/>
  <text x="517" y="565" class="label" text-anchor="middle">images, labels,</text>
  <text x="517" y="582" class="label" text-anchor="middle">clouds</text>
  <path class="edge" d="M640,595 L726,595" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="667" y="568" width="32" height="19" rx="3"/>
  <text x="683" y="582" class="label" text-anchor="middle">ONNX</text>
  <path class="edge" d="M972,595 L1058,595" marker-end="url(#arrow)"/>
