<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 615" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Comminution circuit with its energy models and the mine-to-mill link</title>
  <desc id="d">The blasted muck-pile size distribution feeds a primary crusher, a SAG mill, a ball mill in closed circuit with a cyclone and flotation; each stage carries its energy or recovery model (Bond, Morrell, population balance, Klimpel); a meta-model learns the chain and a worked example shows that blasting acts mainly through fines.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .ah-acc{fill:var(--accent)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah-acc"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="615"/>

  <!-- Band 1: circuit -->
  <rect class="band" x="20" y="20" width="1060" height="230" rx="8"/>
  <text class="title" x="36" y="46">Circuit: energy enters at every size-reduction stage</text>
  <text class="label" x="36" y="96">from D1 blast:</text>
  <text class="item" x="36" y="114">muck-pile PSD</text>
  <text class="item" x="36" y="132">(x50, b, xmax)</text>
  <line class="edge-accent" x1="40" y1="160" x2="198" y2="160" marker-end="url(#arrow-acc)"/>
  <text class="label" x="44" y="152">ROM feed</text>

  <rect class="box" x="200" y="70" width="190" height="165" rx="8"/>
  <text class="title" x="214" y="94">Primary crusher</text>
  <text class="path" x="214" y="114">minephys.comminution</text>
  <text class="item" x="214" y="136">closed-side setting</text>
  <text class="item" x="214" y="154">→ product size</text>
  <text class="label" x="214" y="180">E_crush = W · ṁ</text>

  <rect class="box-accent" x="430" y="70" width="190" height="165" rx="8"/>
  <text class="title" x="444" y="94">SAG mill</text>
  <text class="path" x="444" y="114">minephys.comminution</text>
  <text class="item" x="444" y="136">Morrell SMC energy</text>
  <text class="item" x="444" y="154">rate set by feed fines</text>
  <text class="label" x="444" y="180">E_SAG (kWh/t)</text>

  <rect class="box" x="660" y="70" width="190" height="165" rx="8"/>
  <text class="title" x="674" y="94">Ball mill + cyclone</text>
  <text class="path" x="674" y="114">minephys.comminution</text>
  <text class="item" x="674" y="136">Bond energy to P80</text>
  <text class="item" x="674" y="154">PBM inside the mill</text>
  <text class="item" x="674" y="172">underflow recirculates</text>
  <text class="label" x="674" y="198">E_ball = W · ṁ</text>

  <rect class="box" x="890" y="70" width="180" height="165" rx="8"/>
  <text class="title" x="904" y="94">Flotation</text>
  <text class="path" x="904" y="114">minephys.comminution</text>
  <text class="item" x="904" y="136">Klimpel kinetics</text>
  <text class="item" x="904" y="154">two-product balance</text>
  <text class="label" x="904" y="180">→ concentrate, tails</text>

  <line class="edge-accent" x1="390" y1="150" x2="428" y2="150" marker-end="url(#arrow-acc)"/>
  <text class="label" x="409" y="142" text-anchor="middle">F80</text>
  <line class="edge-accent" x1="620" y1="150" x2="658" y2="150" marker-end="url(#arrow-acc)"/>
  <text class="label" x="639" y="142" text-anchor="middle">T80</text>
  <line class="edge-accent" x1="850" y1="150" x2="888" y2="150" marker-end="url(#arrow-acc)"/>
  <text class="label" x="869" y="142" text-anchor="middle">P80</text>

  <!-- Band 2: coupling -->
  <rect class="box-accent" x="20" y="285" width="500" height="160" rx="8"/>
  <text class="title" x="34" y="309">Mine-to-mill meta-model (M17)</text>
  <text class="path" x="34" y="329">pipeline/ (GBM or MLP → ONNX)</text>
  <text class="item" x="34" y="351">learns the analytical chain from minephys sweeps</text>
  <text class="item" x="34" y="369">inputs: blast design → x50, b, xmax (case D1)</text>
  <text class="item" x="34" y="387">outputs: t/h, kWh/t, cost/t (case D2)</text>
  <text class="caveat" x="34" y="417">acceptance R² ≥ 0.95 vs the chain; Not yet run</text>

  <rect class="box" x="560" y="285" width="520" height="160" rx="8"/>
  <text class="title" x="574" y="309">What blasting changes (illustrative worked example)</text>
  <text class="path" x="574" y="329">minephys.blasting → minephys.comminution</text>
  <text class="item" x="574" y="351">x80 0.60 vs 0.64 m: 1/√F80 ≈ 0.0013 µm^−½ either way</text>
  <text class="item" x="574" y="369">1/√P80 at 150 µm = 0.082 → F80 barely moves Bond W</text>
  <text class="item" x="574" y="387">fines &lt; 5 cm: 13.4 % (Swebrec) vs 9.0 % (Rosin–Rammler)</text>
  <text class="caveat" x="574" y="417">the blast acts mainly through fines and SAG rate</text>

  <line class="edge" x1="270" y1="250" x2="270" y2="283" marker-end="url(#arrow)"/>
  <text class="label" x="278" y="273">chain sweeps</text>
  <path class="edge" d="M700,285 V262 H525 V237" marker-end="url(#arrow)"/>
  <text class="label" x="560" y="276">fines → SAG rate</text>

  <!-- Band 3: models -->
  <rect class="box" x="20" y="470" width="340" height="135" rx="8"/>
  <text class="title" x="34" y="494">Bond (1952)</text>
  <text class="path" x="34" y="514">minephys.comminution</text>
  <text class="label" x="34" y="538">W = 10 W_i (1/√P80 − 1/√F80)  kWh/t</text>
  <text class="item" x="34" y="558">W_i 15, F80 2,000, P80 150 µm → 8.89 kWh/t</text>
  <text class="caveat" x="34" y="586">illustrative W_i; sizes in µm</text>

  <rect class="box" x="380" y="470" width="340" height="135" rx="8"/>
  <text class="title" x="394" y="494">Morrell SMC (2004)</text>
  <text class="path" x="394" y="514">minephys.comminution</text>
  <text class="label" x="394" y="538">W = M_i · 4 · (x₂^f(x₂) − x₁^f(x₁))</text>
  <text class="item" x="394" y="558">f(x) = −(0.295 + x/10⁶)</text>
  <text class="caveat" x="394" y="586">constants UNVERIFIED, pinned at spec</text>

  <rect class="box" x="740" y="470" width="340" height="135" rx="8"/>
  <text class="title" x="754" y="494">Population balance + flotation</text>
  <text class="path" x="754" y="514">minephys.comminution</text>
  <text class="label" x="754" y="538">dm_i/dt = −S_i m_i + Σ_j b_ij S_j m_j</text>
  <text class="label" x="754" y="558">R(t) = R∞ [1 − (1 − e^(−kt)) / (kt)]</text>
  <text class="caveat" x="754" y="586">Klimpel transcription UNVERIFIED</text>
</svg>
