<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" class="psd">
  <title id="t">DEM soft-sphere contact: Hertz–Mindlin with rolling resistance</title>
  <desc id="d">Two overlapping spheres with their normal, tangential and rolling contact directions; the rheological elements of the contact model (nonlinear normal spring and dashpot, tangential spring and dashpot with a Coulomb slider, capped rolling spring); the contact equations and the Rayleigh time-step limit with an illustrative example.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .grain{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5;fill-opacity:0.85}
    .el{stroke:var(--fg);stroke-width:1.6;fill:none}
    .el-n{stroke:var(--chart-4);stroke-width:2;fill:none}
    .el-t{stroke:var(--chart-3);stroke-width:2;fill:none}
    .el-r{stroke:var(--chart-5);stroke-width:2;fill:none}
    .block{fill:var(--bg);stroke:var(--fg);stroke-width:1.6}
    .mark{fill:var(--fg-muted);stroke:var(--bg);stroke-width:2}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="610"/>

  <!-- Band A: two spheres -->
  <rect class="band" x="20" y="20" width="360" height="450" rx="8"/>
  <text class="title" x="36" y="46">Contact between particles i and j</text>
  <line class="edge" x1="110" y1="160" x2="245" y2="160" marker-end="url(#arrow)"/>
  <text class="label" x="177" y="150" text-anchor="middle">n_ij (normal)</text>
  <circle class="grain" cx="110" cy="260" r="75"/>
  <circle class="grain" cx="245" cy="260" r="75"/>
  <circle class="mark" cx="110" cy="260" r="4"/>
  <circle class="mark" cx="245" cy="260" r="4"/>
  <text class="label" x="92" y="250" text-anchor="middle">i</text>
  <text class="item" x="92" y="282" text-anchor="middle">R_i, E_i, ν_i</text>
  <text class="label" x="266" y="250" text-anchor="middle">j</text>
  <text class="item" x="266" y="282" text-anchor="middle">R_j, E_j, ν_j</text>
  <line class="edge" x1="177.5" y1="228" x2="177.5" y2="194" marker-end="url(#arrow)"/>
  <text class="label" x="184" y="206">δ_t</text>
  <line class="edge" x1="177.5" y1="355" x2="177.5" y2="296" marker-end="url(#arrow)"/>
  <text class="label" x="177" y="372" text-anchor="middle">overlap δ_n (lens)</text>
  <path class="edge" d="M80,315 A35,35 0 0 0 140,315" marker-end="url(#arrow)"/>
  <text class="label" x="72" y="342">ω_i</text>
  <path class="edge" d="M215,315 A35,35 0 0 0 275,315" marker-end="url(#arrow)"/>
  <text class="label" x="280" y="342">ω_j</text>
  <text class="item" x="36" y="414">Spheres stand in for rock fragments;</text>
  <text class="item" x="36" y="432">rolling resistance stands in for shape.</text>
  <text class="item" x="36" y="450">Forces act at the contact point.</text>

  <!-- Band B: rheological elements -->
  <rect class="band" x="395" y="20" width="245" height="450" rx="8"/>
  <text class="title" x="411" y="46">Contact elements</text>

  <text class="label" x="411" y="84">Normal (Hertz)</text>
  <line class="el" x1="415" y1="95" x2="415" y2="160"/>
  <line class="el" x1="610" y1="95" x2="610" y2="160"/>
  <polyline class="el-n" points="415,110 430,110 437,100 451,120 465,100 479,120 493,100 507,120 514,110 610,110"/>
  <line class="el-n" x1="415" y1="145" x2="480" y2="145"/>
  <line class="el-n" x1="480" y1="137" x2="480" y2="153"/>
  <path class="el-n" d="M505,133 H468 M468,157 H505 M505,133 V157"/>
  <line class="el-n" x1="505" y1="145" x2="610" y2="145"/>
  <text class="item" x="411" y="178">spring k_n(δ_n) ∥ dashpot c_n</text>

  <text class="label" x="411" y="200">Tangential (Mindlin)</text>
  <line class="el" x1="415" y1="210" x2="415" y2="270"/>
  <line class="el" x1="610" y1="210" x2="610" y2="270"/>
  <polyline class="el-t" points="415,222 430,222 437,212 451,232 465,212 479,232 493,212 507,232 514,222 540,222"/>
  <line class="el-t" x1="415" y1="258" x2="480" y2="258"/>
  <line class="el-t" x1="480" y1="250" x2="480" y2="266"/>
  <path class="el-t" d="M505,246 H468 M468,270 H505 M505,246 V270"/>
  <line class="el-t" x1="505" y1="258" x2="540" y2="258"/>
  <line class="el-t" x1="540" y1="222" x2="540" y2="258"/>
  <line class="el-t" x1="540" y1="240" x2="555" y2="240"/>
  <rect class="block" x="555" y="228" width="30" height="24"/>
  <line class="el" x1="550" y1="256" x2="592" y2="256"/>
  <line class="el-t" x1="585" y1="240" x2="610" y2="240"/>
  <text class="item" x="411" y="292">k_t ∥ dashpot, then slider μ_s F_n</text>

  <text class="label" x="411" y="320">Rolling (elastic–plastic)</text>
  <line class="el" x1="415" y1="332" x2="415" y2="372"/>
  <line class="el" x1="610" y1="332" x2="610" y2="372"/>
  <polyline class="el-r" points="415,352 430,352 437,342 451,362 465,342 479,362 493,342 507,362 514,352 555,352"/>
  <rect class="block" x="555" y="340" width="30" height="24"/>
  <line class="el" x1="550" y1="368" x2="592" y2="368"/>
  <line class="el-r" x1="585" y1="352" x2="610" y2="352"/>
  <text class="item" x="411" y="396">torsion k_r, capped at μ_r R* F_n</text>
  <text class="item" x="411" y="430">slider = Coulomb limit:</text>
  <text class="item" x="411" y="448">sticks below, slips at the cap</text>

  <!-- Band C: equations -->
  <rect class="band" x="655" y="20" width="325" height="450" rx="8"/>
  <text class="title" x="671" y="46">Hertz–Mindlin equations</text>
  <text class="label" x="671" y="70">F_n = 4/3 E* √R* δ_n^(3/2)</text>
  <text class="label" x="671" y="90">F_n^d = −2 √(5/6) β √(S_n m*) v_n</text>
  <text class="label" x="671" y="110">S_n = 2 E* √(R* δ_n)</text>
  <text class="label" x="671" y="130">β = ln e / √(ln² e + π²)</text>
  <text class="label" x="671" y="154">F_t = −S_t δ_t,  S_t = 8 G* √(R* δ_n)</text>
  <text class="label" x="671" y="174">|F_t| ≤ μ_s F_n,  |M_r| ≤ μ_r R* F_n</text>
  <text class="item" x="671" y="196">1/E* = (1 − ν₁²)/E₁ + (1 − ν₂²)/E₂</text>
  <text class="item" x="671" y="214">1/R* = 1/R₁ + 1/R₂</text>
  <text class="item" x="671" y="232">1/m* = 1/m₁ + 1/m₂</text>
  <text class="caveat" x="671" y="254">transcription UNVERIFIED,</text>
  <text class="caveat" x="671" y="272">pinned at specification</text>
  <text class="title" x="671" y="306">Time step (Rayleigh)</text>
  <text class="label" x="671" y="330">Δt_R = π R √(ρ/G) / (0.1631 ν + 0.8766)</text>
  <text class="item" x="671" y="352">R 5 mm, ρ 2,650 kg/m³, E 50 MPa,</text>
  <text class="item" x="671" y="370">ν 0.25 → Δt_R ≈ 0.197 ms</text>
  <text class="item" x="671" y="392">E 50 GPa → 6.2 µs (31.6× smaller)</text>
  <text class="item" x="671" y="410">step = a fraction of Δt_R</text>
  <text class="caveat" x="671" y="440">illustrative inputs; softened E</text>
  <text class="caveat" x="671" y="458">must not shift repose or discharge</text>

  <!-- Bottom band -->
  <rect class="box-accent" x="20" y="490" width="300" height="105" rx="8"/>
  <text class="title" x="34" y="514">Warp DEM kernel (M7)</text>
  <text class="path" x="34" y="534">studio/src/pitstudio_studio/physics/</text>
  <text class="item" x="34" y="554">HashGrid neighbours, contact history</text>
  <text class="caveat" x="34" y="574">own kernel; Warp's demo is linear</text>

  <rect class="box" x="360" y="490" width="280" height="105" rx="8"/>
  <text class="title" x="374" y="514">Calibration targets</text>
  <text class="path" x="374" y="534">st50_physics</text>
  <text class="item" x="374" y="554">repose angle · Beverloo discharge</text>
  <text class="caveat" x="374" y="574">parameter sets are not unique</text>

  <rect class="box" x="680" y="490" width="300" height="105" rx="8"/>
  <text class="title" x="694" y="514">Differentiable calibration (M9)</text>
  <text class="path" x="694" y="534">studio/ · Warp tape vs CMA-ES</text>
  <text class="item" x="694" y="554">friction from repose; CI vs truth</text>
  <text class="caveat" x="694" y="574">Not yet run</text>

  <line class="edge" x1="320" y1="542" x2="358" y2="542" marker-end="url(#arrow)"/>
  <text class="label" x="339" y="534" text-anchor="middle">runs</text>
  <line class="edge" x1="640" y1="542" x2="678" y2="542" marker-end="url(#arrow)"/>
  <text class="label" x="659" y="534" text-anchor="middle">fit</text>
</svg>
