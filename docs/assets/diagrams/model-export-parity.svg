<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Model export, parity gates and web lanes</title>
  <desc id="d">Each trained PyTorch model is exported to ONNX with a pinned opset and IR version, must match PyTorch on a golden set, may be reduced to fp16 or int8 within a task-metric tolerance, and is then labelled LIVE or PRECOMPUTE by the measured lane gate; a table lists the planned lane and size of every model.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .ah-accent{fill:var(--accent)}
    .head{font:600 13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .box-live{fill:var(--surface-2);stroke:var(--chart-2);stroke-width:2}
    .box-replay{fill:var(--surface-2);stroke:var(--chart-4);stroke-width:2}
    .box-local{fill:var(--surface-2);stroke:var(--warning);stroke-width:2;stroke-dasharray:6 4}
    .sw-live{fill:var(--chart-2)} .sw-replay{fill:var(--chart-4)} .sw-local{fill:var(--warning)}
    .rule{stroke:var(--border);stroke-width:1}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah-accent"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="20" y="30">From a PyTorch checkpoint to a labelled web model</text>

  <!-- row 1 -->
  <rect class="box" x="20" y="70" width="270" height="180" rx="6"/>
  <text class="title" x="32" y="94">Checkpoint</text>
  <text class="path" x="32" y="114">s30_train · torch 2.14.1</text>
  <text class="item" x="32" y="136">fp32 weights in eval mode</text>
  <text class="item" x="32" y="154">golden set ≥ 200 input vectors</text>
  <text class="item" x="32" y="172">reference outputs stored</text>
  <text class="caveat" x="32" y="234">checkpoints never committed</text>

  <rect class="box-accent" x="310" y="70" width="270" height="180" rx="6"/>
  <text class="title" x="322" y="94">Export</text>
  <text class="path" x="322" y="114">s60_export · onnx 1.23.1</text>
  <text class="item" x="322" y="136">torch.onnx.export, dynamo</text>
  <text class="item" x="322" y="154">verify=True (default is False)</text>
  <text class="item" x="322" y="172">opset 17–19 per model</text>
  <text class="item" x="322" y="190">IR version pinned to 10</text>
  <text class="item" x="322" y="208">onnxslim pass</text>
  <text class="caveat" x="322" y="234">ORT 1.30 reads IR ≤ 13 only</text>

  <rect class="box" x="600" y="70" width="270" height="180" rx="6"/>
  <text class="title" x="612" y="94">Gate 1: ONNX = PyTorch</text>
  <text class="path" x="612" y="114">ORT CPU EP, fp32</text>
  <text class="item" x="612" y="136">rtol 1e-3, atol 1e-5</text>
  <text class="item" x="612" y="154">max abs ≤ 1e-4</text>
  <text class="item" x="612" y="172">100 % argmax agreement</text>
  <text class="caveat" x="612" y="234">fail → fix the export, never ship</text>

  <rect class="box" x="890" y="70" width="290" height="180" rx="6"/>
  <text class="title" x="902" y="94">Gate 2: reduced precision</text>
  <text class="path" x="902" y="114">fp16 cast · int8 static Q/DQ</text>
  <text class="item" x="902" y="136">task metric Δ ≤ 1 pp vs fp32</text>
  <text class="item" x="902" y="154">masks IoU ≥ 0.99</text>
  <text class="item" x="902" y="172">detectors: corruption curves</text>
  <text class="item" x="902" y="190">per precision (dust, night, rain)</text>
  <text class="caveat" x="902" y="234">failing variants: reported rejected</text>

  <path class="edge" d="M290,96 H306" marker-end="url(#arrow)"/>
  <path class="edge-accent" d="M580,96 H596" marker-end="url(#arrowA)"/>
  <path class="edge-accent" d="M870,96 H886" marker-end="url(#arrowA)"/>
  <text class="label" x="274" y="62">weights</text>
  <text class="label" x="556" y="62">model.onnx</text>
  <text class="label" x="866" y="62">pass</text>

  <!-- row 2 -->
  <path class="edge" d="M1000,250 V270 H155 V286" marker-end="url(#arrow)"/>
  <text class="label" x="165" y="282">fp32, fp16 and int8 variants</text>
  <path class="edge" d="M1140,250 V286" marker-end="url(#arrow)"/>
  <text class="label" x="1062" y="282">ONNX</text>

  <rect class="box-accent" x="20" y="290" width="270" height="160" rx="6"/>
  <text class="title" x="32" y="314">Lane gate (measured)</text>
  <text class="path" x="32" y="334">manifest lane label</text>
  <text class="item" x="32" y="356">file ≤ 25 MB for LIVE</text>
  <text class="item" x="32" y="374">≤ 50 ms/step (surrogates)</text>
  <text class="item" x="32" y="392">≤ 300 ms/image (detector, T1)</text>
  <text class="caveat" x="32" y="434">CI fails on a mislabel</text>

  <rect class="box-live" x="320" y="290" width="320" height="160" rx="6"/>
  <text class="title" x="332" y="314">LIVE in the browser</text>
  <text class="path" x="332" y="334">ORT-web 1.30 · WebGPU → WASM</text>
  <text class="item" x="332" y="356">web parity: WASM fp32 1e-4,</text>
  <text class="item" x="332" y="374">WebGPU fp32 1e-3, fp16 1e-2</text>
  <text class="item" x="332" y="392">top-1 agreement ≥ 0.995</text>
  <text class="caveat" x="332" y="434">ONNX budget ≤ 80 MB in total</text>

  <rect class="box-replay" x="660" y="290" width="250" height="160" rx="6"/>
  <text class="title" x="672" y="314">PRECOMPUTE</text>
  <text class="path" x="672" y="334">s40_infer → baked outputs</text>
  <text class="item" x="672" y="356">model over the 25 MB cap</text>
  <text class="item" x="672" y="374">outputs shown as REPLAY</text>
  <text class="item" x="672" y="392">model file not shipped</text>

  <rect class="box-local" x="930" y="290" width="250" height="160" rx="6"/>
  <text class="title" x="942" y="314">Acceleration (local)</text>
  <text class="path" x="942" y="334">s62_accel · s64_bench</text>
  <text class="item" x="942" y="356">TensorRT engines per</text>
  <text class="item" x="942" y="374">precision, parity per engine</text>
  <text class="item" x="942" y="392">only result tables published</text>

  <path class="edge-accent" d="M290,350 H316" marker-end="url(#arrowA)"/>
  <path class="edge" d="M290,420 H300 V466 H785 V454" marker-end="url(#arrow)"/>
  <text class="label" x="300" y="344">fits</text>
  <text class="label" x="560" y="482">over cap or too slow</text>

  <!-- table -->
  <rect class="band" x="20" y="496" width="1160" height="292" rx="8"/>
  <text class="title" x="36" y="520">Planned lane and size per model (plan estimates; nothing trained yet)</text>
  <text class="head" x="60" y="546">MODEL</text><text class="head" x="330" y="546">FILE</text><text class="head" x="450" y="546">LANE</text>
  <text class="head" x="640" y="546">MODEL</text><text class="head" x="910" y="546">FILE</text><text class="head" x="1030" y="546">LANE</text>
  <line class="rule" x1="36" y1="554" x2="1164" y2="554"/>

  <rect class="sw-live" x="40" y="564" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="575">D-FINE-N, fp16</text><text class="path" x="330" y="575">8 MB</text><text class="item" x="450" y="575">LIVE</text>
  <rect class="sw-live" x="40" y="590" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="601">D-FINE-S, int8</text><text class="path" x="330" y="601">10 MB</text><text class="item" x="450" y="601">LIVE</text>
  <rect class="sw-replay" x="40" y="616" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="627">D-FINE-S, fp32</text><text class="path" x="330" y="627">40 MB</text><text class="item" x="450" y="627">PRECOMPUTE</text>
  <rect class="sw-replay" x="40" y="642" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="653">RF-DETR-Seg-N, fp16</text><text class="path" x="330" y="653">61 MB</text><text class="item" x="450" y="653">PRECOMPUTE</text>
  <rect class="sw-live" x="40" y="668" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="679">U-Net (smp), int8</text><text class="path" x="330" y="679">5–15 MB</text><text class="item" x="450" y="679">LIVE</text>
  <rect class="sw-live" x="40" y="694" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="705">GNS 2-D surrogate</text><text class="path" x="330" y="705">~3 MB</text><text class="item" x="450" y="705">LIVE</text>
  <rect class="sw-live" x="40" y="720" width="12" height="12" rx="2"/>
  <text class="label" x="60" y="731">FNO-2D fields</text><text class="path" x="330" y="731">~5 MB</text><text class="item" x="450" y="731">LIVE</text>

  <rect class="sw-live" x="620" y="564" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="575">PPO + attention dispatch</text><text class="path" x="910" y="575">&lt; 2 MB</text><text class="item" x="1030" y="575">LIVE</text>
  <rect class="sw-live" x="620" y="590" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="601">TCN / PatchTST</text><text class="path" x="910" y="601">&lt; 4 MB</text><text class="item" x="1030" y="601">LIVE</text>
  <rect class="sw-live" x="620" y="616" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="627">Chronos-Bolt-tiny</text><text class="path" x="910" y="627">~18 MB</text><text class="item" x="1030" y="627">LIVE</text>
  <rect class="sw-live" x="620" y="642" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="653">Mine-to-mill meta-model</text><text class="path" x="910" y="653">&lt; 1 MB</text><text class="item" x="1030" y="653">LIVE</text>
  <rect class="sw-live" x="620" y="668" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="679">Isaac Lab IL-1 / IL-2 policies</text><text class="path" x="910" y="679">&lt; 1 MB</text><text class="item" x="1030" y="679">LIVE (TS twin)</text>
  <rect class="sw-replay" x="620" y="694" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="705">DEM calibration</text><text class="path" x="910" y="705">—</text><text class="item" x="1030" y="705">baked results</text>
  <rect class="sw-local" x="620" y="720" width="12" height="12" rx="2"/>
  <text class="label" x="640" y="731">Cosmos Reason 2 (inference)</text><text class="path" x="910" y="731">text</text><text class="item" x="1030" y="731">precomputed text</text>
  <text class="caveat" x="40" y="768">Sizes and lanes are plan estimates; the lane gate measures them at export and CI fails on a mislabel. Cosmos weights stay local (reference-only).</text>
</svg>
