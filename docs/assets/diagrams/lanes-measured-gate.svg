<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="t d" class="psd">
  <title id="t">The measured lane gate</title>
  <desc id="d">A capability is LIVE only if it is web-drivable, every asset is at most 25 MB, it is fast enough on the WebAssembly tier and its trace is at most 10 MB; any failed check sends it to PRECOMPUTE and REPLAY, and performance data of licence-restricted NVIDIA software stays LOCAL-ONLY.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--primary)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .arrowhead-hi{fill:var(--accent)}
    .lane-live{fill:var(--chart-2);fill-opacity:.12;stroke:var(--chart-2);stroke-width:2}
    .lane-replay{fill:var(--chart-4);fill-opacity:.12;stroke:var(--chart-4);stroke-width:2}
    .lane-local{fill:var(--warning);fill-opacity:.12;stroke:var(--warning);stroke-width:2}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-hi"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="670"/>
  <text class="title" x="30" y="40">Lane assignment: LIVE only when every measured check passes</text>

  <!-- input -->
  <rect class="box" x="30" y="70" width="270" height="150" rx="8"/>
  <text class="title" x="46" y="96">Capability + measurements</text>
  <text class="path" x="46" y="118">manifest.json → lane</text>
  <text class="item" x="46" y="142">bytes, ms on T1 and T2,</text>
  <text class="item" x="46" y="160">trace size, runtime needs</text>
  <text class="caveat" x="46" y="200">numbers are estimates until measured</text>

  <!-- checks -->
  <rect class="box" x="360" y="70" width="400" height="64" rx="8"/>
  <text class="title" x="376" y="96">web-drivable?</text>
  <text class="item" x="376" y="120">no GPU runtime or proprietary engine needed</text>

  <rect class="box" x="360" y="170" width="400" height="64" rx="8"/>
  <text class="title" x="376" y="196">asset ≤ 25 MB?</text>
  <text class="item" x="376" y="220">every file the browser loads for it</text>

  <rect class="box" x="360" y="270" width="400" height="64" rx="8"/>
  <text class="title" x="376" y="296">fast enough on T2 (WASM)?</text>
  <text class="item" x="376" y="320">interaction ≤ 16 ms, or a full run ≤ 1 s</text>

  <rect class="box" x="360" y="370" width="400" height="64" rx="8"/>
  <text class="title" x="376" y="396">trace ≤ 10 MB?</text>
  <text class="item" x="376" y="420">replay shards or event traces it streams</text>

  <!-- live -->
  <rect class="lane-live" x="360" y="470" width="400" height="110" rx="8"/>
  <text class="title" x="376" y="496">LIVE: computed in the browser</text>
  <text class="path" x="376" y="518">T1 WebGPU · T2 WASM · T0 baked</text>
  <text class="item" x="376" y="542">analytical models, DES, min-cut, Rapier,</text>
  <text class="item" x="376" y="560">surrogates and policies in ORT-web</text>

  <!-- precompute / replay -->
  <rect class="lane-replay" x="840" y="70" width="330" height="370" rx="8"/>
  <text class="title" x="856" y="96">PRECOMPUTE → REPLAY</text>
  <text class="path" x="856" y="118">studio publish → baked files</text>
  <text class="item" x="856" y="146">RTX renders, SDG samples, sensor</text>
  <text class="item" x="856" y="164">clouds, Kit captures, Isaac Lab</text>
  <text class="item" x="856" y="182">rollouts, GPU granular runs</text>
  <text class="item" x="856" y="210">RF-DETR-Seg-N (61 MB) and</text>
  <text class="item" x="856" y="228">D-FINE-S fp32 (40 MB): over the cap</text>
  <text class="item" x="856" y="256">Cosmos answers: text, display-only</text>
  <text class="item" x="856" y="284">regular-TensorRT tables of our</text>
  <text class="item" x="856" y="302">models, open-runtime telemetry</text>
  <text class="caveat" x="856" y="344">video pair ≤ 25 MB, shards ≤ 10 MB</text>
  <text class="caveat" x="856" y="362">fallbacks: poster frames, tables</text>

  <!-- local only -->
  <rect class="lane-local" x="840" y="470" width="330" height="150" rx="8"/>
  <text class="title" x="856" y="496">LOCAL-ONLY (performance data)</text>
  <text class="path" x="856" y="518">performance: local-only</text>
  <text class="item" x="856" y="542">timings and telemetry of Isaac Sim,</text>
  <text class="item" x="856" y="560">Kit, Replicator, ovrtx, TensorRT for RTX</text>
  <text class="caveat" x="856" y="586">NVIDIA SLA §8.9 · TRT-RTX SLA §2.13</text>
  <text class="caveat" x="856" y="604">their outputs may still be REPLAY</text>

  <!-- edges -->
  <path class="edge-accent" d="M300,102 H356" marker-end="url(#arrow-hi)"/>
  <text class="label" x="329" y="94" text-anchor="middle">measure</text>

  <path class="edge-accent" d="M560,134 V166" marker-end="url(#arrow-hi)"/>
  <text class="label" x="570" y="156">yes</text>
  <path class="edge-accent" d="M560,234 V266" marker-end="url(#arrow-hi)"/>
  <text class="label" x="570" y="256">yes</text>
  <path class="edge-accent" d="M560,334 V366" marker-end="url(#arrow-hi)"/>
  <text class="label" x="570" y="356">yes</text>
  <path class="edge-accent" d="M560,434 V466" marker-end="url(#arrow-hi)"/>
  <text class="label" x="570" y="456">yes</text>

  <path class="edge" d="M760,102 H836" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="94" text-anchor="middle">no</text>
  <path class="edge" d="M760,202 H836" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="194" text-anchor="middle">no</text>
  <path class="edge" d="M760,302 H836" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="294" text-anchor="middle">no</text>
  <path class="edge" d="M760,402 H836" marker-end="url(#arrow)"/>
  <text class="label" x="798" y="394" text-anchor="middle">no</text>

  <path class="edge" d="M165,220 V600 H836" marker-end="url(#arrow)"/>
  <text class="label" x="180" y="592">licence check, per tool</text>

  <text class="caveat" x="30" y="652">Each artefact records its lane in manifest.json; CI fails when a lane label does not match its measurements.</text>
</svg>
