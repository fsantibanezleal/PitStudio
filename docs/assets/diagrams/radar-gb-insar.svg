  <text class="label-warn" x="900" y="290" text-anchor="middle">each jump of 2π = λ/2 of motion</text>
  <rect class="box" x="610" y="340" width="220" height="112" rx="8"/>
  <text class="title" x="624" y="364">Voight creep field</text>
  <text class="path" x="624" y="384">synthetic, known t_f</text>
  <text class="item" x="624" y="406">accelerating creep</text>
  <text class="item" x="624" y="426">regressive variants</text>
  <rect class="box" x="850" y="340" width="220" height="112" rx="8"/>
  <text class="title" x="864" y="364">LOS series + noise</text>
  <text class="path" x="864" y="384">projection on ê</text>
  <text class="item" x="864" y="406">atmospheric + phase noise</text>
  <text class="item" x="864" y="426">matched to de Wit series</text>
  <rect class="box-accent" x="610" y="474" width="460" height="118" rx="8"/>
  <text class="title" x="624" y="498">Unwrap + inverse velocity</text>
  <text class="path" x="624" y="518">C1 forecasters (M14)</text>
  <text class="item" x="624" y="540">1/v → 0 at failure (Voight α ≈ 2); TCN, PatchTST, Chronos</text>
  <text class="item" x="624" y="560">HCN 2013: 2 in/day, one scan per 6 min → 0.21 mm/scan ≪ λ/4</text>
  <text class="caveat" x="624" y="580">real de Wit series = one event: descriptive only</text>
  <path class="edge" d="M830,396 L848,396" marker-end="url(#arrow)"/>
  <path class="edge" d="M960,452 L960,472" marker-end="url(#arrow)"/>
