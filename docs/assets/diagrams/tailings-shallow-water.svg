<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="t d" class="psd">
  <title id="t">Tailings breach run-out: hydrograph, shallow-water solver, arrival-time and depth maps</title>
  <desc id="d">A prescribed breach hydrograph and the terrain grid feed a Warp shallow-water solver with Bingham bed stress, verified on dam-break benchmarks; it writes arrival-time and depth maps that train an FNO surrogate served live in the browser.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--primary)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .arrowhead-accent{fill:var(--accent)}
    .edge-dash{stroke:var(--fg-muted);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
    .lane-live{fill:none;stroke:var(--chart-2);stroke-width:1.8;stroke-dasharray:7 4}
    .lane-replay{fill:none;stroke:var(--chart-4);stroke-width:1.8;stroke-dasharray:7 4}
    .lane-local{fill:none;stroke:var(--warning);stroke-width:1.8;stroke-dasharray:7 4}
    .key-live{fill:var(--chart-2)}
    .key-replay{fill:var(--chart-4)}
    .key-local{fill:var(--warning)}
    .ok{fill:var(--success)}
    .bad{fill:var(--danger)}
    .warn{fill:var(--warning)}
    .ok-stroke{stroke:var(--success);stroke-width:2;fill:none}
    .bad-stroke{stroke:var(--danger);stroke-width:2;fill:none}
    .cut{stroke:var(--danger);stroke-width:2.4;stroke-dasharray:8 5;fill:none}
    .axis{stroke:var(--fg-muted);stroke-width:1.2;fill:none}
    .grid{stroke:var(--border);stroke-width:1;fill:none}
    .series{stroke:var(--accent);stroke-width:2.2;fill:none}
    .series-2{stroke:var(--chart-2);stroke-width:2;stroke-dasharray:6 4;fill:none}
    .dust{fill:var(--surface-2);stroke:var(--warning);stroke-width:1.5;stroke-dasharray:4 3}
    .solid{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .ore{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .node{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .node-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .region{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
    .label-ok{font:600 13px Inter,system-ui,sans-serif;fill:var(--success)}
    .label-bad{font:600 13px Inter,system-ui,sans-serif;fill:var(--danger)}
    .label-warn{font:600 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label-accent{font:600 13px Inter,system-ui,sans-serif;fill:var(--accent)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-accent"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="600"/>
  <rect class="band" x="16" y="44" width="330" height="392" rx="10"/>
  <text class="label" x="30" y="36">Inputs (studio/, Python 3.14)</text>
  <rect class="band" x="372" y="44" width="350" height="392" rx="10"/>
  <text class="label" x="386" y="36">Physics (stage st50_physics)</text>
  <rect class="band" x="748" y="44" width="336" height="392" rx="10"/>
  <text class="label" x="762" y="36">Outputs and web</text>
  <rect class="band" x="16" y="470" width="1068" height="118" rx="10"/>
  <text class="label" x="30" y="462">Verification and context</text>
  <rect class="box" x="30" y="60" width="302" height="186" rx="8"/>
  <text class="title" x="44" y="84">Breach hydrograph</text>
  <text class="path" x="44" y="104">recipe input: Q(t)</text>
  <text class="item" x="44" y="126">prescribed outflow, no breach erosion</text>
  <text class="item" x="44" y="146">triangle: T = 2V / Q_p</text>
  <text class="caveat" x="44" y="234">Miraí 2007: 3.8 Mm³, 422 m³/s</text>
  <path class="axis" d="M46,218 L300,218 M46,218 L46,162"/>
  <path class="series" d="M46,218 L104,172 L300,218"/>
  <text class="label" x="112" y="170">Q_p</text>
  <text class="label" x="286" y="210">t</text>
  <rect class="box" x="30" y="262" width="302" height="160" rx="8"/>
  <text class="title" x="44" y="286">Terrain grid</text>
  <text class="path" x="44" y="306">st10_terrain: 3DEP 1 m DEM</text>
  <text class="item" x="44" y="328">bed elevation z_b(x, y), cell Δx</text>
  <text class="item" x="44" y="348">pit variant: rain source, pump sinks</text>
  <text class="item" x="44" y="368">stage-volume V(z) from the DEM</text>
  <text class="caveat" x="44" y="410">hypothetical facility on real terrain</text>
  <rect class="box-accent" x="386" y="60" width="322" height="362" rx="8"/>
  <text class="title" x="400" y="84">Shallow-water solver (Warp)</text>
  <text class="path" x="400" y="104">warp-lang 1.17.0</text>
  <text class="item" x="400" y="128">mass: ∂h/∂t + ∇·(h u) = S_h</text>
  <text class="item" x="400" y="150">momentum: ∂(hu)/∂t + ∇·(hu⊗u + ½gh² I)</text>
  <text class="item" x="400" y="172">     = −g h ∇z_b − τ_b / ρ</text>
  <text class="item" x="400" y="194">finite volume, HLL / Rusanov flux</text>
  <text class="item" x="400" y="216">CFL: Δt ≤ C Δx / max(|u| + √(gh))</text>
  <text class="item" x="400" y="238">Bingham: τ_b ≈ 1.5 τ_y + 3 μ_B U / h</text>
  <text class="item" x="400" y="260">arrest where h ≤ τ_y / (ρ g sin θ)</text>
  <text class="item" x="400" y="282">wet/dry fronts keep h ≥ 0</text>
  <text class="item" x="400" y="304">total volume changes only via S_h</text>
  <text class="caveat" x="400" y="410">depth-averaged; τ_y, μ_B UNVERIFIED</text>
  <rect class="box" x="762" y="60" width="308" height="170" rx="8"/>
  <text class="title" x="776" y="84">Arrival time and depth maps</text>
  <text class="path" x="776" y="104">Zarr fields (replay)</text>
  <text class="item" x="776" y="126">t_arr(x) = min{ t : h &gt; h_thr }</text>
  <text class="item" x="776" y="146">h_max(x), v_max(x)</text>
  <text class="item" x="776" y="166">inundated area A (m²)</text>
  <text class="caveat" x="776" y="218">educational, not regulatory</text>
  <rect class="lane-replay" x="756" y="54" width="320" height="182" rx="12"/>
  <rect class="box" x="762" y="270" width="308" height="152" rx="8"/>
  <text class="title" x="776" y="294">FNO surrogate (live)</text>
  <text class="path" x="776" y="314">s30_train → s60_export</text>
  <text class="item" x="776" y="336">DFT-matmul FNO, ≈ 5 MB ONNX</text>
  <text class="item" x="776" y="356">accept: relative L2 ≤ 5 % (held-out)</text>
  <text class="item" x="776" y="376">ORT-web + WGSL twin in the browser</text>
  <text class="caveat" x="776" y="410">not yet run</text>
  <rect class="lane-live" x="756" y="264" width="320" height="164" rx="12"/>
  <rect class="box" x="386" y="484" width="322" height="96" rx="8"/>
  <text class="title" x="400" y="508">Dam-break benchmarks</text>
  <text class="path" x="400" y="528">physics test suite</text>
  <text class="item" x="400" y="550">Ritter (dry bed), Stoker (wet bed)</text>
  <text class="item" x="400" y="570">Martin &amp; Moyce; SPHERIC Test 2</text>
  <rect class="box" x="30" y="484" width="302" height="96" rx="8"/>
  <text class="title" x="44" y="508">Empirical run-out (context)</text>
  <text class="path" x="44" y="528">Concha Larrauri &amp; Lall 2018</text>
  <text class="item" x="44" y="550">D_max = a X^b (a, b UNVERIFIED)</text>
  <text class="item" x="44" y="570">no fit claimed until pinned</text>
  <rect class="key-live" x="770" y="499" width="22" height="12" rx="2"/>
  <text class="label" x="800" y="510">live lane</text>
  <rect class="key-replay" x="770" y="521" width="22" height="12" rx="2"/>
  <text class="label" x="800" y="532">precompute / replay lane</text>
  <text class="caveat" x="770" y="566">Status: not yet run</text>
  <path class="edge-accent" d="M332,140 L384,140" marker-end="url(#arrow-accent)"/>
  <text class="label" x="338" y="130">Q(t)</text>
  <path class="edge" d="M332,340 L384,340" marker-end="url(#arrow)"/>
  <text class="label" x="342" y="330">z_b</text>
  <path class="edge-accent" d="M708,140 L760,140" marker-end="url(#arrow-accent)"/>
  <text class="label" x="712" y="130">h(x,t)</text>
  <path class="edge" d="M916,236 L916,262" marker-end="url(#arrow)"/>
  <text class="label" x="926" y="254">fields → pairs</text>
  <path class="edge" d="M547,484 L547,424" marker-end="url(#arrow)"/>
  <text class="label" x="556" y="456">verify solver</text>
</svg>
