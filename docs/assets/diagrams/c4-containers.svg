<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="t d" class="psd">
  <title id="t">C4 containers of PitStudio</title>
  <desc id="d">On the maintainer's workstation a loopback console sends jobs to the runner, which launches stages in isolated studio and pipeline environments that import the core library and write outputs and manifests to the content-addressed store; studio publish moves baked artefacts to the public repository and release assets, from which pages.yml builds the static web app.</desc>
  <style>
    .psd{--bg:#ffffff;--surface:#f7f4fb;--surface-2:#eee8f5;--fg:#1b1523;--fg-muted:#5c5468;--border:#ddd6e6;
      --border-strong:#7d7589;--primary:#7500c0;--code:#7500c0;--accent:#a100ff;--primary-soft:#f1e3ff;--danger:#b42318;
      --success:#067647;--warning:#93370d;--info:#175cd3;--chart-1:#7500c0;--chart-2:#0e7c86;--chart-3:#c2410c;
      --chart-4:#1d4ed8;--chart-5:#be185d;--chart-6:#4d7c0f}
    @media (prefers-color-scheme: dark){.psd{--bg:#0f0b14;--surface:#1a1521;--surface-2:#251e2e;--fg:#f4f0f8;
      --fg-muted:#b7aec3;--border:#352c40;--border-strong:#8c829b;--primary:#a100ff;--code:#be82ff;--accent:#be82ff;
      --primary-soft:#2e1a47;--danger:#fda29b;--success:#75e0a7;--warning:#fec84b;--info:#84adff;--chart-1:#be82ff;
      --chart-2:#2dd4bf;--chart-3:#fb923c;--chart-4:#60a5fa;--chart-5:#f472b6;--chart-6:#a3e635}}
    .bg{fill:var(--bg)}
    .band{fill:var(--surface);stroke:var(--border);stroke-width:1}
    .box{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
    .box-accent{fill:var(--primary-soft);stroke:var(--accent);stroke-width:2}
    .title{font:600 15px Inter,system-ui,sans-serif;fill:var(--fg)}
    .path{font:13px "JetBrains Mono",ui-monospace,monospace;fill:var(--code)}
    .item{font:13px Inter,system-ui,sans-serif;fill:var(--fg-muted)}
    .caveat{font:italic 13px Inter,system-ui,sans-serif;fill:var(--warning)}
    .label{font:13px Inter,system-ui,sans-serif;fill:var(--fg)}
    .edge{stroke:var(--fg-muted);stroke-width:1.5;fill:none}
    .edge-accent{stroke:var(--accent);stroke-width:2.2;fill:none}
    .arrowhead{fill:var(--fg-muted)}
    .arrowhead-hi{fill:var(--accent)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-hi"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="730"/>
  <text class="title" x="20" y="40">C4 level 2 · containers: what runs where</text>

  <rect class="band" x="20" y="60" width="810" height="650" rx="10"/>
  <text class="title" x="36" y="86">Maintainer's RTX workstation: local-only, never in CI</text>
  <rect class="band" x="850" y="60" width="330" height="650" rx="10"/>
  <text class="title" x="866" y="86">Public (GitHub)</text>

  <!-- console -->
  <rect class="box" x="40" y="100" width="350" height="140" rx="8"/>
  <text class="title" x="56" y="126">Studio console</text>
  <text class="path" x="56" y="148">api/ · web/console/</text>
  <text class="item" x="56" y="172">FastAPI on 127.0.0.1, /health, SSE;</text>
  <text class="item" x="56" y="190">recipes, queue, runs, artefacts</text>
  <text class="caveat" x="56" y="222">excluded from the Pages build</text>

  <!-- runner -->
  <rect class="box-accent" x="460" y="100" width="350" height="140" rx="8"/>
  <text class="title" x="476" y="126">Runner (CLI: studio)</text>
  <text class="path" x="476" y="148">src/pitstudio/runner/</text>
  <text class="item" x="476" y="172">recipe DAG, CAS cache, queue.db,</text>
  <text class="item" x="476" y="190">gpu0.compute / gpu0.nvenc locks,</text>
  <text class="item" x="476" y="208">guards, NVML 1–4 Hz, job objects</text>

  <!-- studio envs -->
  <rect class="box" x="40" y="320" width="350" height="200" rx="8"/>
  <text class="title" x="56" y="346">Studio environments</text>
  <text class="path" x="56" y="368">studio/ (Python 3.14)</text>
  <text class="path" x="56" y="386">studio/isaac · rtx · isaaclab</text>
  <text class="path" x="56" y="404">  (Python 3.12, uv-managed)</text>
  <text class="path" x="56" y="422">studio/kit · studio/reason</text>
  <text class="item" x="56" y="446">scene, physics, encode, telemetry;</text>
  <text class="item" x="56" y="464">RTX renders, SDG, sensors, RL, VLM</text>
  <text class="caveat" x="56" y="500">one env per tool family, own lock</text>

  <!-- pipeline envs -->
  <rect class="box" x="460" y="320" width="350" height="200" rx="8"/>
  <text class="title" x="476" y="346">Pipeline environments</text>
  <text class="path" x="476" y="368">pipeline/ (3.14, torch cu130)</text>
  <text class="path" x="476" y="386">pipeline/accel/ (TensorRT 11.3)</text>
  <text class="item" x="476" y="410">s00_download → … → s60_export,</text>
  <text class="item" x="476" y="428">then s62_accel → s64_bench</text>
  <text class="caveat" x="476" y="500">TensorRT engines never committed</text>

  <!-- core -->
  <rect class="box" x="40" y="580" width="350" height="110" rx="8"/>
  <text class="title" x="56" y="606">Core library + contracts</text>
  <text class="path" x="56" y="628">minephys · src/pitstudio/</text>
  <text class="path" x="56" y="646">contracts/*.schema.json</text>
  <text class="item" x="56" y="670">models, manifest, lane gate, types</text>

  <!-- store -->
  <rect class="box" x="460" y="580" width="350" height="110" rx="8"/>
  <text class="title" x="476" y="606">Studio store</text>
  <text class="path" x="476" y="628">PITSTUDIO_STORE (e.g. C:\ps)</text>
  <text class="item" x="476" y="652">cas/ · runs/&lt;run_id&gt;/ · queue.db</text>
  <text class="item" x="476" y="670">locks/ · views/ (hardlinks)</text>

  <!-- web app -->
  <rect class="box" x="870" y="110" width="290" height="250" rx="8"/>
  <text class="title" x="886" y="136">Web app</text>
  <text class="path" x="886" y="158">web/ → build/client</text>
  <text class="item" x="886" y="182">React Router 8, prerendered;</text>
  <text class="item" x="886" y="200">three.js / R3F, ORT-web 1.30,</text>
  <text class="item" x="886" y="218">Pyodide, TS workers, WGSL;</text>
  <text class="item" x="886" y="236">/studio tool map, runs, GPU</text>
  <text class="caveat" x="886" y="340">static: no backend</text>

  <!-- repository and releases -->
  <rect class="box" x="870" y="450" width="290" height="180" rx="8"/>
  <text class="title" x="886" y="476">Repository + releases</text>
  <text class="path" x="886" y="498">main · assets-vX.YY.ZZZ</text>
  <text class="item" x="886" y="522">baked files &lt; 10 MB in git</text>
  <text class="item" x="886" y="540">(≤ 100 MB in total); larger</text>
  <text class="item" x="886" y="558">ones as release assets</text>
  <text class="item" x="886" y="576">pinned by SHA-256</text>
  <text class="caveat" x="886" y="610">browser never fetches releases</text>

  <!-- edges -->
  <path class="edge" d="M390,150 H456" marker-end="url(#arrow)"/>
  <text class="label" x="425" y="140" text-anchor="middle">POST /jobs</text>
  <path class="edge" d="M460,200 H394" marker-end="url(#arrow)"/>
  <text class="label" x="425" y="222" text-anchor="middle">SSE events</text>

  <path class="edge-accent" d="M520,240 V282 H215 V316" marker-end="url(#arrow-hi)"/>
  <text class="label" x="225" y="274">uv run --project … --frozen</text>
  <path class="edge-accent" d="M700,240 V316" marker-end="url(#arrow-hi)"/>
  <text class="label" x="710" y="285">uv run --frozen</text>

  <path class="edge" d="M300,520 V550 H560 V576" marker-end="url(#arrow)"/>
  <text class="label" x="310" y="543">outputs + manifest.json</text>
  <path class="edge" d="M700,520 V576" marker-end="url(#arrow)"/>
  <text class="label" x="710" y="553">outputs + manifest</text>

  <path class="edge" d="M120,580 V524" marker-end="url(#arrow)"/>
  <text class="label" x="130" y="556">imported</text>

  <path class="edge-accent" d="M810,610 H866" marker-end="url(#arrow-hi)"/>
  <text class="label" x="838" y="600" text-anchor="middle">studio</text>
  <text class="label" x="838" y="628" text-anchor="middle">publish</text>

  <path class="edge-accent" d="M1015,450 V364" marker-end="url(#arrow-hi)"/>
  <text class="label" x="1025" y="410">pages.yml</text>

  <path class="edge" d="M1015,66 V106" marker-end="url(#arrow)"/>
  <text class="label" x="1025" y="90">visitors over HTTPS</text>
</svg>
